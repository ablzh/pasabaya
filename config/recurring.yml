production:
  retry_deleted_avatar_purges:
    command: "AccountDeletionTombstone.where.not(avatar_blob_id: nil).find_each(&:enqueue_avatar_purge)"
    schedule: every hour at minute 20
  clear_solid_queue_finished_jobs:
    command: "SolidQueue::Job.clear_finished_in_batches(sleep_between_batches: 0.3)"
    schedule: every hour at minute 12
  purge_old_chat_messages:
    class: PurgeOldChatMessagesJob
    queue: default
    schedule: every day at 3am
  sweep_trip_audits:
    class: TripAuditRecoveryJob
    schedule: every hour at minute 30
  retry_undelivered_notifications:
    class: NotificationRecoveryJob
    queue: default
    schedule: every hour at minute 45
  revoke_expired_memberships:
    command: "CommunityMembership.revoke_expired!"
    schedule: every hour at minute 15
